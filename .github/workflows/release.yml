name: Release

# When a vX.Y.Z tag is pushed: tests, installer, install test and a public release with the Setup.exe.
#   1. Bump "version" in package.json (for example 1.2.0), add "## [1.2.0]" to CHANGELOG.md and merge to main.
#   2. git tag v1.2.0 && git push origin v1.2.0
# Release notes come from CHANGELOG.md; the app shows them when announcing a new version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) { throw "Tag $env:TAG does not match package.json version ($packageVersion)" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the notes from CHANGELOG
        run: node installer/release-notes.mjs ${{ env.VERSION }} dist/notes.md

      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Install it and open the app
        shell: pwsh
        run: ./installer/verify.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            "dist/Transcriptor-Setup-$env:VERSION.exe" `
            "dist/Transcriptor-Setup-$env:VERSION.exe.sha256" `
            --title "LocalKit $env:VERSION" `
            --notes-file dist/notes.md
