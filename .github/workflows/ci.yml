name: CI

# On every pull request and every change to main: types, tests, and build and test the installer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new commit on a PR cancels that PR's previous run, which is no longer useful. Nothing is cancelled on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: CHANGELOG has the package.json version
        shell: pwsh
        run: node installer/release-notes.mjs (Get-Content package.json -Raw | ConvertFrom-Json).version

  installer:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1
      - name: Install it and open the app
        shell: pwsh
        run: ./installer/verify.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: test-installer
          path: dist/*.exe
          retention-days: 7
