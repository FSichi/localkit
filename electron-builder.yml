# Windows recognizes the installed app by this id. Changing it would install a second copy instead of updating.
appId: com.codetria.transcriptor
productName: LocalKit
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraFiles:
  - from: node_modules/ffmpeg-static/LICENSE
    to: licenses/ffmpeg-GPL.txt
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: THIRD_PARTY.md
    to: licenses/THIRD_PARTY.md
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: LocalKit
  artifactName: LocalKit-Setup-${version}.exe
